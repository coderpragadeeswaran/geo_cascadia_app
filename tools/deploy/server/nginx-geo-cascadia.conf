# GEO-CASCADIA on one server (D63): the web build and the API under /api on port 80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/geo-cascadia/current/web;
    index index.html;
    client_max_body_size 10m;                        # review appeal photos are capped at 8 MB by the API

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The worker talks to the API on 127.0.0.1 directly; its endpoints are not reachable from outside (the read-only
    # status, also part of GET /jobs, is).
    location = /api/worker/status { proxy_pass http://127.0.0.1:8000/worker/status; }
    location /api/worker/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;           # strips /api
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                     # first load after a restart reads every area (~18 s); reports ~4 s
        proxy_send_timeout 300s;
    }

    location /assets/ {                              # hashed file names: cache for a long time
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";         # index.html always fresh after a deploy
        try_files $uri $uri/ /index.html;
    }
}
